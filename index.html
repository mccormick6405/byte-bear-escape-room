<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byte Bear’s Digital Lockdown — Final Story Edition</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#153051}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#c5f4ea,transparent 36%),radial-gradient(circle at 100% 0,#ffe0a2,transparent 36%),#eaf4ff}header{background:#112e61;color:#fff;padding:17px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:1.2rem}main{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:white;border:3px solid #cbdff5;border-radius:22px;padding:clamp(20px,4vw,38px);box-shadow:0 10px 30px #133b6c22}.hero{display:grid;grid-template-columns:1fr 215px;gap:22px;align-items:center}.hero img{width:100%;max-height:250px;object-fit:contain}h1{font-size:clamp(2rem,4vw,3.1rem);margin:6px 0}h2{font-size:clamp(1.6rem,3vw,2.2rem);margin:8px 0}p{line-height:1.6}.label{font-size:.83rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#11738d}.mission{padding:15px;background:#e7f7ff;border-left:6px solid #22a6a3;border-radius:10px;margin:20px 0}.progress{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.step{padding:9px 12px;background:#e5eef9;border-radius:9px;font-weight:800}.active{background:#156bc7;color:white}.done{background:#c8f4d7}.task{padding:20px;background:#f2f8ff;border:2px solid #d2e3f7;border-radius:15px;margin:17px 0}.task h3{margin:0 0 12px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:9px}.choice,button{cursor:pointer;font:inherit;font-weight:750;border-radius:10px;padding:12px 16px}.choice{background:white;border:2px solid #abc7e7;color:#153051}.choice.chosen{border:3px solid #0c6ac9;background:#d8eeff}button.primary{background:#156ac9;color:white;border:0}button.secondary{background:#f9e8ba;color:#443109;border:0}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}textarea,input[type=text]{width:100%;padding:12px;border:2px solid #abc7e7;border-radius:10px;font:inherit}textarea{min-height:100px}label{font-weight:750;display:block;margin:18px 0 8px}.feedback{font-weight:800;color:#a22c36;min-height:24px}.hint{background:#fff2d0;border-left:5px solid #edb22c;padding:12px;border-radius:9px;margin-top:12px}.tag{background:#ffd16d;color:#273c5b;padding:7px 12px;border-radius:30px;font-weight:800}.report{border:2px dashed #1478c5;padding:20px;border-radius:14px;background:#f5fbff}.foot{font-size:.9rem;color:#48617c;padding:20px 0}.small{font-size:.88rem;color:#4b6681}@media(max-width:650px){.hero{grid-template-columns:1fr}.hero img{max-height:145px;order:-1}}@media print{header,.buttons,.foot{display:none}body{background:white}.panel{border:0;box-shadow:none}}
.map-wrap{margin:16px 0;padding:16px;border:2px solid #a8d0f5;border-radius:14px;background:#fff}.map-heading{font-weight:900;margin:0 0 8px}.map-grid{display:grid;grid-template-columns:34px repeat(5,minmax(34px,54px));gap:5px}.map-cell{display:grid;place-items:center;aspect-ratio:1;border:2px solid #a4bed9;border-radius:7px;background:#f2f8ff;font-weight:800;font-size:.82rem}.map-axis{background:#d9ecff}.map-start{background:#fff0bd;border-color:#caa43c}.notebook-alert{background:#fff0b7;border:3px solid #e1a729;border-radius:12px;padding:14px 16px;margin:15px 0}.map-note{font-size:.9rem;color:#49617d}</style></head><body><header><strong>🔐 BYTE BEAR’S DIGITAL LOCKDOWN</strong><span class="tag">STORY EDITION • 5 LOCKS • 30 POINTS</span></header><main><nav style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><button class="secondary" onclick="replayStory()">📖 Replay Opening Story</button><button class="secondary" onclick="restartStory()">↻ Restart Entire Mission</button></nav><div id="app" class="panel"></div><p class="foot">No coding required. This game stores progress in this browser only. Download or print your completion report before leaving.</p></main><script>
const locks=[{"title": "The Pattern Archive", "skill": "Patterns & constraints", "story": "Three terminals are broadcasting signals. Only one signal belongs to the archive. You must analyze the pattern and apply the archivist’s rule.", "tasks": [["Terminal A: 4, 9, 14, 19, __. What is next?", ["23", "24", "25", "29"], 1, "Compare consecutive differences.", "Check whether each step changes by the same amount. Verify your rule using two pairs."], ["Terminal B: 2, 6, 12, 20, 30, __. What is next?", ["40", "42", "44", "36"], 1, "Look at how much each jump grows.", "Write down the gaps between neighboring numbers. Look for a rule in those gaps."], ["Archivist’s rule: Choose the next number from Terminal A if it is divisible by 3; otherwise choose Terminal B. What is the archive key?", ["24", "42", "66", "12"], 0, "Use the first two results, then apply the rule exactly.", "Test the first terminal's result against the divisibility condition before selecting a terminal."]], "code": "24"}, {"title": "The Robot Delivery", "skill": "Algorithms & simulation", "story": "A delivery robot starts facing EAST on a 5×5 map. Columns are A–E, rows are 1–5. Follow commands literally. A command that would move off the map is ignored.", "tasks": [["Start at B2, facing EAST. Move forward 2, turn RIGHT, move forward 1. Where are you?", ["D3", "D1", "C3", "E3"], 0, "Turning right from EAST means SOUTH.", "Trace the route on the grid one command at a time; note direction changes."], ["From D3 facing SOUTH: turn LEFT, move forward 2. Where are you after the map rule is applied?", ["A3", "E3", "D5", "E4"], 1, "Left from SOUTH points EAST.", "Apply the edge-of-map rule after each individual forward step."], ["From E3 facing EAST: turn LEFT, forward 2, turn LEFT, forward 3. Final position?", ["B1", "C1", "B5", "D1"], 0, "Track both position and direction.", "Track position and facing direction separately after every command."]], "code": "B1"}, {"title": "The Glitch Workshop", "skill": "Debugging & testing", "story": "The system has a procedure for sending a completed report. A faulty version passes one test but fails another. Find the real problem.", "tasks": [["Procedure: 1 Type report; 2 Close editor; 3 Save report; 4 Send report. What is the earliest faulty step?", ["1", "2", "3", "4"], 1, "What needs to happen before closing?", "Find the first action that could cause work to be lost."], ["Which revised order is reliable?", ["Type → Save → Close → Send", "Save → Type → Send → Close", "Type → Close → Send → Save", "Send → Type → Save → Close"], 0, "Put the report content in place before saving.", "Which steps must happen before you end an editing session?"], ["Test: A student types new edits after saving, then closes and sends. What additional step is required?", ["Rename folder", "Save again after edits", "Delete old report", "Turn off computer"], 1, "Think about what changed since the last save.", "Ask what must happen whenever the content changes after its last save."]], "code": "SAVE"}, {"title": "The Evidence Vault", "skill": "Evidence & elimination", "story": "Four students handled a file. Your job is to find the only explanation consistent with every clue. Do not confuse a guess with evidence.", "tasks": [["Log: 9:02 file created in PROJECTS; 9:05 renamed to FINAL; 9:08 copied to ARCHIVE; 9:10 PROJECTS searched for the original name. Why did that search fail?", ["File was never created", "The file was renamed", "The computer crashed", "ARCHIVE was deleted"], 1, "Compare the searched name with the log.", "Compare the searched filename with the event log."], ["Which location is confirmed to contain a copy at 9:08?", ["TRASH", "DOWNLOADS", "ARCHIVE", "PICTURES"], 2, "Only use what the log states.", "Find the log entry that proves a second location exists."], ["A witness says “the file was deleted.” Which response is best supported?", ["Agree; all missing files are deleted", "Disagree; the log supports renaming and copying, not deletion", "Agree; searching failed", "No conclusion is possible about any event"], 1, "Separate observed events from assumptions.", "Separate events documented in the log from assumptions made by a witness."]], "code": "ARCHIVE"}, {"title": "The Final Override", "skill": "Integrating evidence", "story": "The control panel asks you to combine the previous four keys, but the technician left an additional ordering rule. You must use your notes, not guess.", "tasks": [["Which key came from the debugging lock?", ["24", "B1", "SAVE", "ARCHIVE"], 2, "Think about the correction that protected edits.", "Review the action that prevented lost edits in the workshop."], ["Technician’s rule: Put the LOCATION key first, then the NUMBER key, then the ACTION key, then the FILE DESTINATION key. Which sequence follows the rule?", ["B1 / 24 / SAVE / ARCHIVE", "24 / B1 / ARCHIVE / SAVE", "ARCHIVE / SAVE / B1 / 24", "B1 / SAVE / 24 / ARCHIVE"], 0, "Classify each key by what it represents.", "Label each previous key by its type before ordering the keys."], ["A teammate proposes B1 / 24 / ARCHIVE / SAVE. What is the precise mistake?", ["Location and number reversed", "Action and destination reversed", "Number was calculated incorrectly", "Nothing is wrong"], 1, "Compare positions 3 and 4 with the technician’s rule.", "Compare the categories of the last two entries against the technician's rule."]], "code": "UNLOCKED"}];
let state={stage:-1,scene:0,epilogue:0,answers:[],attempts:[],hints:[],explanations:[],done:[]};
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem('bytebear-final-story-v1',JSON.stringify(state))}catch(e){}}
try{const saved=JSON.parse(localStorage.getItem('bytebear-final-story-v1'));if(saved&&Array.isArray(saved.done))state={scene:0,epilogue:0,...saved}}catch(e){}
function begin(){state={stage:0,scene:0,epilogue:0,answers:[],attempts:[],hints:[],explanations:[],done:[]};save();render()}
function restartStory(){if(!confirm("Restart the entire mission? This will clear your progress."))return;state={stage:-1,scene:0,epilogue:0,answers:[],attempts:[],hints:[],explanations:[],done:[]};save();render()}
function replayStory(){state.scene=0;save();showScene()}
function nextScene(){state.scene=Math.min(3,(state.scene||0)+1);save();render()}
function nextEpilogue(){state.epilogue=Math.min(2,(state.epilogue||0)+1);save();render()}
function showScene(){const scenes=[
['11:47 A.M. • THE ARCHIVE GOES DARK','Byte Bear was preparing the Digital Detective Academy’s files for the showcase. Suddenly, the lights flickered. Every archive screen flashed ACCESS DENIED.','“The system recognizes my name,” Byte Bear said, “but it will not release a single file.”','Continue the story →'],
['11:49 A.M. • A MESSAGE FROM SENTINEL','The archive’s automated caretaker, SENTINEL, announced: “Emergency Lockdown Protocol activated. Five verification locks must be solved in sequence.”','Byte Bear found a useful clue: the locks use skills the Academy has already practiced. No new programming knowledge is needed.','Read the mission →'],
['11:51 A.M. • THE DETECTIVE IS YOU','Byte Bear needs someone who can follow evidence, trace instructions, identify errors, and recognize patterns. Every solved lock reveals a key. The final control panel will need your earlier keys in a special order.','<strong>TAKE NOTES THROUGHOUT THE GAME! Write down EVERY lock key and how you found it. You will NEED your notes for the FINAL CHALLENGE.</strong>','Review detective protocol →'],
['DETECTIVE PROTOCOL','Work alone or with one partner. Every student submits an individual report. Each of the five locks has three challenges. You can retry answers and request strategy hints. Your teacher will review your explanations for up to 30 points.','<strong>IMPORTANT: Keep a written record of each key. Do not rely on remembering it later.</strong>','Begin Lock 1 →']];const i=Math.min(3,state.scene||0),s=scenes[i];app.innerHTML=`<div class="progress">${scenes.map((x,j)=>`<span class="step ${j===i?'active':j<i?'done':''}">Scene ${j+1}</span>`).join('')}</div><div class="hero"><div><div class="label">Mission briefing • Scene ${i+1} of 4</div><h1>${s[0]}</h1><p>${s[1]}</p><div class="${i===2?'notebook-alert':'mission'}">${s[2]}</div><div class="buttons"><button class="primary" onclick="${i===3?'begin()':'nextScene()'}">${s[3]}</button></div></div><img src="byte-bear.png" alt="Byte Bear detective"></div>`}
function showEpilogue(){const scenes=[
['THE LAST LOCK RELEASES','The final sequence clicks into place. A chime sounds through the archive. Red warning lights turn green. SENTINEL announces: “Verification successful. Digital Lockdown lifted.”','Byte Bear looks up at the restored monitors. “You did it! You followed the evidence instead of guessing.”','Continue →'],
['THE CASE IS CLOSED','The investigation files reappear. They were never destroyed; they had been protected behind the emergency verification system. Byte Bear begins restoring the Academy’s showcase.','“The best detectives do not always get it right the first time,” Byte Bear says. “They test, debug, and explain how they know.”','Open your detective report →']];const i=Math.min(1,state.epilogue||0),s=scenes[i];app.innerHTML=`<div class="hero"><div><div class="label">Case resolution • ${i+1} of 2</div><h1>${s[0]}</h1><p>${s[1]}</p><div class="mission">${s[2]}</div><div class="buttons"><button class="primary" onclick="nextEpilogue()">${s[3]}</button></div></div><img src="byte-bear-celebration.png" alt="Byte Bear celebrating the restored archive"></div>`}
function setAnswer(i,j){state.answers[state.stage]??=[null,null,null];state.answers[state.stage][i]=j;save();render()}
function hint(i){state.hints[state.stage]??=[0,0,0];state.hints[state.stage][i]=Math.min(2,(state.hints[state.stage][i]||0)+1);save();render()}
function keepText(){let t=document.getElementById('reason');if(t)state.explanations[state.stage]=t.value;save()}
function robotGrid(){let cells='<div class="map-cell map-axis">↘</div>';for(let c of ['A','B','C','D','E'])cells+=`<div class="map-cell map-axis">${c}</div>`;for(let r=1;r<=5;r++){cells+=`<div class="map-cell map-axis">${r}</div>`;for(let c of ['A','B','C','D','E'])cells+=`<div class="map-cell ${c==='B'&&r===2?'map-start':''}">${c}${r}${c==='B'&&r===2?' ★':''}</div>`}return `<section class="map-wrap" aria-label="Five by five robot map"><p class="map-heading">🗺️ Robot movement grid</p><div class="map-grid">${cells}</div><p class="map-note">★ Start at B2 facing EAST. North is toward row 1; south is toward row 5. Trace on scrap paper if helpful.</p></section>`}
function render(){if(state.stage<0){showScene();return}if(state.stage>=5){if((state.epilogue||0)<2)showEpilogue();else finish();return}const k=locks[state.stage],a=state.answers[state.stage]||[],hs=state.hints[state.stage]||[];app.innerHTML=`<div class="progress">${locks.map((x,i)=>`<span class="step ${i<state.stage?'done':i===state.stage?'active':''}">${i<state.stage?'✓':'🔒'} Lock ${i+1}</span>`).join('')}</div><div class="label">Lock ${state.stage+1} / 5 · ${esc(k.skill)}</div><h2>${esc(k.title)}</h2><p>${esc(k.story)}</p><div class="notebook-alert"><strong>📝 TAKE NOTES: Save every lock key. You will need them for the Final Override!</strong></div>${state.stage===1?robotGrid():''}${k.tasks.map((t,i)=>`<div class="task"><h3>Challenge ${i+1} of 3</h3><p>${esc(t[0])}</p><div class="choices">${t[1].map((c,j)=>`<button class="choice ${a[i]===j?'chosen':''}" onclick="keepText();setAnswer(${i},${j})" aria-pressed="${a[i]===j}">${esc(c)}</button>`).join('')}</div><div class="buttons"><button class="secondary" onclick="keepText();hint(${i})">💡 ${hs[i]?'Deeper clue':'Get a clue'}</button></div>${hs[i]?`<div class="hint"><b>Hint ${hs[i]}:</b> ${esc(t[hs[i]===1?3:4])}</div>`:''}</div>`).join('')}<label for="reason">Detective notebook: explain how you solved this lock (at least two complete sentences).</label><textarea id="reason" oninput="state.explanations[state.stage]=this.value;save()" placeholder="Explain the steps you followed, the clues you used, and how you checked your conclusion.">${esc(state.explanations[state.stage]||'')}</textarea><p class="small">A correct choice is not enough. Your teacher will assess your explanation and process.</p><p class="feedback" id="feedback" role="status"></p><div class="buttons"><button class="secondary" onclick="replayStory()">↶ Replay opening story</button><button class="primary" onclick="check()">Check all three challenges →</button></div>`}
function check(){keepText();const s=state.stage,k=locks[s],a=state.answers[s]||[];if(a.length<3||a.some(x=>x==null)){document.getElementById('feedback').textContent='Answer all three challenges before checking.';return}if((state.explanations[s]||'').trim().length<75){document.getElementById('feedback').textContent='Write a fuller explanation of your process (about two complete sentences).';return}state.attempts[s]=(state.attempts[s]||0)+1;const wrong=k.tasks.map((t,i)=>a[i]!==t[2]?i+1:null).filter(Boolean);if(wrong.length){document.getElementById('feedback').textContent=`Not yet. Recheck challenge${wrong.length>1?'s':''} ${wrong.join(', ')}. Your progress is saved.`;save();return}state.done[s]={code:k.code,attempts:state.attempts[s],hints:(state.hints[s]||[]).reduce((a,b)=>a+b,0)};state.stage++;save();render()}
function finish(){app.innerHTML=`<div class="hero"><div><div class="label">Official detective debrief</div><h1>🔓 Case Closed: Archive Restored!</h1><p>All five locks are open, and the Academy archive has been restored. Complete your detective report below.</p><p><span class="tag">5 locks completed • 30 points possible</span></p></div><img src="byte-bear-celebration.png" alt="Byte Bear celebrating"></div><div class="report"><h2>Individual Detective Report</h2><label for="student">Your name (included only in the report you download)</label><input id="student" type="text" placeholder="First and last name"><p><b>Completed:</b> 5 / 5 locks. <b>Official score:</b> Teacher awards up to 6 points per lock based on accurate work and explanations.</p>${locks.map((k,i)=>`<p><b>${i+1}. ${esc(k.title)}</b> — ${esc(state.done[i].code)}<br><span class="small">Attempts: ${state.done[i].attempts} · Hints used: ${state.done[i].hints}</span><br><b>Explanation:</b> ${esc(state.explanations[i])}</p>`).join('')}</div><div class="buttons"><button class="primary" onclick="window.print()">Print / Save PDF</button><button class="secondary" onclick="download()">Download report (.txt)</button><button class="secondary" onclick="restartStory()">Restart game</button></div><p class="mission">Submit your downloaded report or saved PDF in Google Classroom. This website does not automatically send work to your teacher.</p>`}
function download(){const n=document.getElementById('student').value.trim()||'Student';const lines=['BYTE BEAR DIGITAL LOCKDOWN — FINAL STORY EDITION',`Name: ${n}`,'Five locks completed — teacher awards official grade','',...locks.flatMap((k,i)=>[`${i+1}. ${k.title} / key ${state.done[i].code}`,`Attempts: ${state.done[i].attempts}; hints: ${state.done[i].hints}`,`Reasoning: ${state.explanations[i]}`,''])];const blob=new Blob([lines.join('\n')],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ByteBear_Detective_Report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();
</script></body></html>
